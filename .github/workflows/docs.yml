name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby deps
        working-directory: docs
        run: bundle install

      - name: Build Jekyll (inline cd: step-level working-directory as belt-and-suspenders)
        run: cd docs && bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install freestruct deps
        run: npm install

      - name: Run freestruct (--strict: broken links fail the build; the #4 graduation)
        run: node bin/freestruct.mjs --strict

      - name: Install Pagefind (official npm dist, not the global install)
        working-directory: docs
        run: npm install --no-save pagefind

      - name: Index search
        run: npx pagefind --site docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
