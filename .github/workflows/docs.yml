name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby deps
        working-directory: docs
        run: bundle install

      # Inline cd + step-level working-directory as belt-and-suspenders (jekyll-leg safety).
      - name: Build Jekyll
        run: cd docs && bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install freestruct deps
        run: npm ci --no-audit --no-fund

      # --strict: broken links fail the build (the #4 graduation).
      - name: Run freestruct strict
        run: node bin/freestruct.mjs --strict

      # Cached by the pinned gate sha - the github install costs ~7m cold
      # (measured), the campaign ~1s; a cache hit skips the minutes entirely.
      - name: Restore crashtest (docs dogfood installer cache)
        id: ct
        uses: actions/cache@v4
        with:
          path: node_modules/crashtest
          key: crashtest-dc80a7c7a42e58a532b8ad624b79de2742d1ccbb
      - name: Install crashtest (cache misses only)
        if: ${{ steps.ct.outputs['cache-hit'] != 'true' }}
        run: npm install --no-save --no-audit --no-fund github:dhaupin/crashtest#dc80a7c7a42e58a532b8ad624b79de2742d1ccbb
      - name: Crashtest the built docs
        run: node node_modules/crashtest/bin/crashtest.js run

      - name: Install Pagefind (official npm dist, not the global install)
        working-directory: docs
        run: npm install --no-save pagefind

      - name: Index search
        run: npx pagefind --site docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
