# Deploy Docs - a THIN caller of the canonical reusable lane (issue #31).
#
# The runbook that used to live here inline (checkout, ruby, jekyll, node,
# freestruct --strict, crashtest dogfood, pinned+cached pagefind, Pages
# upload, deploy) now lives in .github/workflows/docs-lane.yml as a
# workflow_call. This repo dogfoods its own lane with the defaults, so the
# push path is the same run; the other rig projects can call the same lane
# and thin their hand-copies to a file this size.
name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # freestruct dogfoods its own lane: no inputs means the defaults
    # (docs/, docs/_site, ruby 3.4, node 22, pagefind 1.5.2, `node
    # bin/freestruct.mjs --strict`).
    uses: ./.github/workflows/docs-lane.yml
