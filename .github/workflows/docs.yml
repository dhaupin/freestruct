# Deploy Docs - a THIN caller of the canonical reusable lane (issue #31).
#
# The runbook that used to live here inline (checkout, ruby, jekyll, node,
# freestruct --strict, crashtest dogfood, pinned+cached pagefind, Pages
# upload, deploy) lives in .github/workflows/docs-lane.yml as a workflow_call.
# This repo dogfoods its own lane, so the push path is the same run; the other
# rig projects call the same lane and thin their hand-copies to a file this
# size.
#
# This repo passes the two dogfood inputs the lane cannot guess: its OWN bin
# (it is the engine, checked out - not installed from npm) and the pinned
# crashtest ref for the docs campaign. A consumer that installs freestruct from
# npm leaves both at their defaults.
name: Deploy Docs

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Dogfood: run this repo's own engine and gate the docs with crashtest.
    uses: ./.github/workflows/docs-lane.yml
    with:
      freestruct-cmd: node bin/freestruct.mjs
      crashtest-ref: 873828743d7cc715893619e6295cb0a81251a439
