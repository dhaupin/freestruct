# test.yml
# ---------
# freestruct regression battery on every push and PR (PRD Phase 0.4).
# npm test = test/run.js: fixture-site battery + version-truth pins.
#
# staging is the permanent integration branch (issue #44): work branches off
# staging, PRs target staging, and staging -> main is the only promotion path.
# CI verifies where work lands, so both branches are in the trigger lists.

name: test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Battery
        run: npm test

      # The family prestruct floor (^1.3.0) made mechanical. Rides `npm test`
      # too (the guard's battery is in the test list), but CI runs the leg
      # explicitly so a broken guard is named, not buried in the battery.
      - name: Prestruct pin guard (family floor)
        run: node scripts/check-prestruct-pins.cjs

      - name: Docs audit (frontmatter/links/nav/style/truthfulness)
        run: node scripts/run-docs-audit.cjs

      - name: Claims gate (retired-as-current fiction signatures)
        run: node scripts/check-fiction-signatures.cjs

      - name: Tarball e2e (fresh-install quick start, PRD §4.1 step 5)
        run: node scripts/e2e-install.cjs

      # Crashtest pack teeth (pinned install - never a mutable latest).
      # Cache the installed package by gate sha: the github-tarball install
      # costs ~7m cold on runners (measured), the campaign itself ~1s - the
      # cache is where the minutes live (vant predeploy lesson, pinned-sha
      # edition). Same pinned sha as docs.yml.
      # CRASHTEST_SHA bumped => new cache key => fresh install.
      - name: Restore crashtest (pack selftest installer cache)
        id: ct
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/crashtest
          key: crashtest-873828743d7cc715893619e6295cb0a81251a439
      - name: Install crashtest (cache misses only)
        if: ${{ steps.ct.outputs['cache-hit'] != 'true' }}
        run: npm install --no-save --no-audit --no-fund github:dhaupin/crashtest#873828743d7cc715893619e6295cb0a81251a439
      - name: Crashtest pack selftest (hardened holds / regressed trips)
        run: CRASHTEST_BIN=node_modules/crashtest/bin/crashtest.js node scripts/packs-selftest.cjs

      # Packstruct manifest lint (pinned install - same pattern as crashtest:
      # the zero-dep lint CLI kills broken pack manifests at author time, and
      # the gate keeps the /packs spec contract from drifting). Cache by pin
      # sha; a bump means a fresh (cheap) install. lint + --deep probe the
      # entries module census, not just the manifest shape.
      - name: Restore packstruct (manifest linter cache)
        id: ps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/packstruct
          key: packstruct-5e473120ed73c5a38b88644cc101be492d5dc2a2
      - name: Install packstruct (cache misses only)
        if: ${{ steps.ps.outputs['cache-hit'] != 'true' }}
        run: npm install --no-save --no-audit --no-fund github:dhaupin/packstruct#5e473120ed73c5a38b88644cc101be492d5dc2a2
      - name: Packstruct lint (manifest contract + deep module census)
        run: |
          node node_modules/packstruct/bin/cli.mjs lint packs
          node node_modules/packstruct/bin/cli.mjs lint packs --deep

      - name: Engine template sync check (canonical engine/_freestruct in lockstep)
        run: node scripts/sync-templates.mjs check
