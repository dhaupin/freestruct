# test.yml
# ---------
# freestruct regression battery on every push and PR (PRD Phase 0.4).
# npm test = test/run.js: fixture-site battery + version-truth pins.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Battery
        run: npm test

      - name: Docs audit (frontmatter/links/nav/style/truthfulness)
        run: node scripts/run-docs-audit.cjs

      - name: Tarball e2e (fresh-install quick start, PRD §4.1 step 5)
        run: node scripts/e2e-install.cjs

      # Crashtest pack teeth (pinned install - never a mutable latest):
      # the two-sided selftest proves the freestruct-docs-shapes pack HOLDS
      # a hardened freestruct build and TRIPS a deliberately regressed one.
      - name: Crashtest pack selftest (hardened holds / regressed trips)
        run: |
          npm install --no-save github:dhaupin/crashtest#dc80a7c7a42e58a532b8ad624b79de2742d1ccbb
          CRASHTEST_BIN=node_modules/crashtest/bin/crashtest.js node scripts/packs-selftest.cjs

      - name: Engine template sync check (canonical engine/_freestruct in lockstep)
        run: node scripts/sync-templates.mjs check
