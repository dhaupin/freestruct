title: freestruct
description: SEO layer for static doc sites
# Canonical scheme truth: https everywhere (issue #12 - the absolute_url
# canonicals in _layouts/default.html inherit THIS scheme, and freestruct
# preserves existing canonicals, so an http value here ships wrong canonicals)
url: https://freestruct.creadev.org
baseurl:

# Theme
theme: null
# plugins:
#   - jekyll-sitemap  # removed - freestruct generates sitemap.xml

# Search
search:
  provider: pagefind

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

# Sass
sass:
  sass_dir: assets/scss
  style: compressed

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: page

# Navigation: single-sourced in docs/_data/nav.yml (see docs/guides/navigation.md).
# No generateNav/nav_sections/nav_order - those belonged to the deleted
# plugin and are retired config keys, not recognized anywhere.
