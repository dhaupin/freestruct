      url: /guides/navigation
    - title: Cache Busting
      url: /guides/cache-busting
    - title: Cache Busting FAQ
      url: /guides/cache-busting-faq
    - title: CI/CD
      url: /guides/cicd
    - title: Custom Injection
      url: /guides/custom-injection
    - title: Post-Render Hooks
      url: /guides/post-render-hooks
    - title: Template
      url: /guides/template
    - title: Troubleshooting
      url: /guides/troubleshooting
    - title: Freestruct.config Reference
      url: /guides/freestruct-config
    - title: CLI Reference
      url: /guides/cli

- title: Contributions
