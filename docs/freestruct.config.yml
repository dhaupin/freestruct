# Site configuration
site:
  name: freestruct
  url: https://freestruct.creadev.org
  description: Post-build SEO layer for static docs

# Author identity: ships as a schema.org Person under "founder" on the
# injected Organization JSON-LD block
author:
  name: Creadev.org
  url: https://creadev.org

# Maintainer identity: custom JSON-LD appended after the built-in
# Organization + WebSite blocks (missing-only gate keeps pages that arrive
# with their own ld+json untouched)
jsonLd:
  - "@type": Person
    name: dhaupin
    url: https://github.com/dhaupin
    jobTitle: Freestruct maintainer

# Open Graph - object form (og.image: { src, width, height, alt }) so the
# audit's width/height/alt glow rows pass; dimensions match the real file.
og:
  image:
    src: /og-image.png
    width: 1200
    height: 630
    alt: freestruct - post-build SEO layer for static doc sites
  type: website
  locale: en_US

# Discovery - dogfooding the 1.1.0 surface on our own docs:
# auto BreadcrumbList per page + the llms.txt AI summary.
# Pagefind owns search (no server search URL), so no SearchAction here.
breadcrumb: true
llms: true
# Generate sitemap.xml
generateSitemap: true

# Generate 404.html
generate404: true

# Generate robots.txt
generateRobots: true

# Minify HTML (experimental, off by default)
# minify: true

# Cache busting (a build hash is always generated; assetQueryParam on by default)

# Generate RSS feed (on by default)
generateFeed: true

# Inject reading time (on by default)
readingTime: true

# Inject last modified (on by default)
lastModified: true

# Add lazy loading to images (on by default)
lazyLoad: true

# Check internal links (on by default)
linkCheck: true

# Generate search.json - OPT-IN as of Phase 1 (default off)
# Our own docs site does NOT use it: Pagefind owns search here
# (the layout's client-side search loads /pagefind/). Decision recorded
# per issue #13 + owner call: search.json stays an opt-in feature for
# consumers, this site indexes with Pagefind.
searchIndex: false
